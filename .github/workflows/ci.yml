name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TeachSpark.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: TeachSpark.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint + format check
        run: npm run quality

      - name: Production build
        run: npm run build

  dotnet:
    name: .NET build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
        env:
          ConnectionStrings__DefaultConnection: "Data Source=/tmp/teachspark-ci.db"
          LlmConfiguration__ApiKey: "ci-test-placeholder-key"
          TeachSpark__LogFilePath: "/tmp/teachspark-ci.log"
